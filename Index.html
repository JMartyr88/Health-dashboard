<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Health Dashboard">
    <meta name="theme-color" content="#1f2937">
    <title>Health Dashboard</title>
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%233b82f6' width='180' height='180'/><text x='50%' y='50%' font-size='80' font-weight='bold' fill='white' text-anchor='middle' dy='.3em'>♥️</text></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        html, body, #root {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            padding-top: max(12px, env(safe-area-inset-top));
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
        
        input, select, textarea {
            font-size: 16px !important;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }
        
        .metric-widget {
            background: white;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        const e = React.createElement;
        const { useState, useEffect, useRef } = React;

        const HealthDashboard = () => {
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authenticated, setAuthenticated] = useState(false);
            const [lastSynced, setLastSynced] = useState(null);
            const chartRefs = useRef({});

            // Google Drive API Configuration
            const CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID'; // Will need to be set up
            const FOLDER_NAME = 'Health Data';

            useEffect(() => {
                loadDataFromLocalStorage();
                checkAuthentication();
            }, []);

            const checkAuthentication = () => {
                const token = localStorage.getItem('google_drive_token');
                if (token) {
                    setAuthenticated(true);
                    syncFromGoogleDrive();
                }
            };

            const loadDataFromLocalStorage = () => {
                try {
                    const cached = localStorage.getItem('health_data');
                    if (cached) {
                        setData(JSON.parse(cached));
                    }
                    setLoading(false);
                } catch (error) {
                    console.error('Error loading cached data:', error);
                    setLoading(false);
                }
            };

            const syncFromGoogleDrive = async () => {
                try {
                    const token = localStorage.getItem('google_drive_token');
                    if (!token) return;

                    // Fetch JSON files from Health Data folder in Google Drive
                    const response = await fetch(
                        `https://www.googleapis.com/drive/v3/files?q=name contains '.json' and trashed=false&spaces=drive&pageSize=100`,
                        {
                            headers: { 'Authorization': `Bearer ${token}` }
                        }
                    );

                    const files = await response.json();
                    if (files.files && files.files.length > 0) {
                        const healthData = {
                            whoopEntries: [],
                            bloodworkEntries: [],
                            bodyCompEntries: [],
                            lifestyleEntries: [],
                            lastUpdated: new Date().toISOString()
                        };

                        // Fetch each JSON file and merge data
                        for (const file of files.files) {
                            const fileContent = await fetch(
                                `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,
                                {
                                    headers: { 'Authorization': `Bearer ${token}` }
                                }
                            );
                            const fileData = await fileContent.json();
                            
                            if (fileData.whoopEntries) healthData.whoopEntries.push(...fileData.whoopEntries);
                            if (fileData.bloodworkEntries) healthData.bloodworkEntries.push(...fileData.bloodworkEntries);
                            if (fileData.bodyCompEntries) healthData.bodyCompEntries.push(...fileData.bodyCompEntries);
                            if (fileData.lifestyleEntries) healthData.lifestyleEntries.push(...fileData.lifestyleEntries);
                        }

                        setData(healthData);
                        localStorage.setItem('health_data', JSON.stringify(healthData));
                        setLastSynced(new Date().toLocaleString());
                    }
                } catch (error) {
                    console.error('Error syncing from Google Drive:', error);
                }
            };

            const renderDashboard = () => {
                if (!data) return e('div', { className: 'text-center py-12' }, 'No data available');

                const latestBodyComp = data.bodyCompEntries?.[data.bodyCompEntries.length - 1];
                const latestBloodwork = data.bloodworkEntries?.[data.bloodworkEntries.length - 1];
                const latestWhoop = data.whoopEntries?.[data.whoopEntries.length - 1];
                const latestLifestyle = data.lifestyleEntries?.[data.lifestyleEntries.length - 1];

                return e('div', { className: 'space-y-6' },
                    e('div', { className: 'grid grid-cols-2 gap-4' },
                        // Body Composition Widget
                        e('div', { className: 'metric-widget' },
                            e('p', { className: 'text-sm text-gray-600 mb-2' }, 'Body Fat'),
                            e('p', { className: 'text-3xl font-bold text-gray-900' }, latestBodyComp?.bodyFat?.toFixed(1) || 'N/A'),
                            e('p', { className: 'text-xs text-gray-500 mt-1' }, '%')
                        ),
                        
                        // Muscle Mass Widget
                        e('div', { className: 'metric-widget' },
                            e('p', { className: 'text-sm text-gray-600 mb-2' }, 'Muscle Mass'),
                            e('p', { className: 'text-3xl font-bold text-gray-900' }, latestBodyComp?.muscleMass?.toFixed(1) || 'N/A'),
                            e('p', { className: 'text-xs text-gray-500 mt-1' }, 'kg')
                        ),
                        
                        // Recovery Widget
                        e('div', { className: 'metric-widget' },
                            e('p', { className: 'text-sm text-gray-600 mb-2' }, 'Recovery Score'),
                            e('p', { className: 'text-3xl font-bold text-green-600' }, latestWhoop?.recoveryScore || 'N/A'),
                            e('p', { className: 'text-xs text-gray-500 mt-1' }, '/ 100')
                        ),
                        
                        // Sleep Efficiency Widget
                        e('div', { className: 'metric-widget' },
                            e('p', { className: 'text-sm text-gray-600 mb-2' }, 'Sleep Efficiency'),
                            e('p', { className: 'text-3xl font-bold text-blue-600' }, latestWhoop?.sleepEfficiency || 'N/A'),
                            e('p', { className: 'text-xs text-gray-500 mt-1' }, '%')
                        ),

                        // Testosterone Widget
                        e('div', { className: 'metric-widget' },
                            e('p', { className: 'text-sm text-gray-600 mb-2' }, 'Total Testosterone'),
                            e('p', { className: 'text-3xl font-bold text-purple-600' }, latestBloodwork?.totalTestosterone?.toFixed(1) || 'N/A'),
                            e('p', { className: 'text-xs text-gray-500 mt-1' }, 'nmol/L')
                        ),

                        // Stress Level Widget
                        e('div', { className: 'metric-widget' },
                            e('p', { className: 'text-sm text-gray-600 mb-2' }, 'Stress Level'),
                            e('p', { className: 'text-3xl font-bold text-orange-600' }, latestLifestyle?.stressLevel || 'N/A'),
                            e('p', { className: 'text-xs text-gray-500 mt-1' }, '/ 10')
                        )
                    ),

                    // Trend Charts
                    e('div', { className: 'bg-white p-4 rounded-lg border border-gray-200' },
                        e('h3', { className: 'text-lg font-bold text-gray-900 mb-4' }, 'Body Composition Trend'),
                        e('div', { className: 'chart-container' },
                            e('canvas', { ref: el => chartRefs.current.bodyFat = el })
                        )
                    ),

                    e('div', { className: 'bg-white p-4 rounded-lg border border-gray-200' },
                        e('h3', { className: 'text-lg font-bold text-gray-900 mb-4' }, 'Recovery Trend'),
                        e('div', { className: 'chart-container' },
                            e('canvas', { ref: el => chartRefs.current.recovery = el })
                        )
                    )
                );
            };

            const renderBloodwork = () => {
                if (!data?.bloodworkEntries?.length) {
                    return e('div', { className: 'text-center py-12 text-gray-600' }, 'No bloodwork data');
                }

                return e('div', { className: 'space-y-4' },
                    data.bloodworkEntries.map((entry, idx) =>
                        e('div', { key: idx, className: 'bg-white p-4 rounded-lg border border-gray-200' },
                            e('p', { className: 'font-bold text-gray-900 mb-3' }, entry.date),
                            e('div', { className: 'grid grid-cols-2 gap-3 text-sm' },
                                entry.totalTestosterone && e('p', null, e('span', { className: 'font-medium' }, 'Total Test: '), entry.totalTestosterone, ' nmol/L'),
                                entry.freeTestosterone && e('p', null, e('span', { className: 'font-medium' }, 'Free Test: '), entry.freeTestosterone, ' pmol/L'),
                                entry.shbg && e('p', null, e('span', { className: 'font-medium' }, 'SHBG: '), entry.shbg, ' nmol/L'),
                                entry.oestradiol && e('p', null, e('span', { className: 'font-medium' }, 'Oestradiol: '), entry.oestradiol, ' pmol/L'),
                                entry.fastingGlucose && e('p', null, e('span', { className: 'font-medium' }, 'Glucose: '), entry.fastingGlucose, ' mmol/L'),
                                entry.totalCholesterol && e('p', null, e('span', { className: 'font-medium' }, 'Cholesterol: '), entry.totalCholesterol, ' mmol/L')
                            )
                        )
                    )
                );
            };

            const renderFitness = () => {
                if (!data?.whoopEntries?.length) {
                    return e('div', { className: 'text-center py-12 text-gray-600' }, 'No fitness data');
                }

                return e('div', { className: 'space-y-4' },
                    data.whoopEntries.map((entry, idx) =>
                        e('div', { key: idx, className: 'bg-white p-4 rounded-lg border border-gray-200' },
                            e('p', { className: 'font-bold text-gray-900 mb-3' }, entry.date),
                            e('div', { className: 'grid grid-cols-2 gap-3 text-sm' },
                                e('p', null, e('span', { className: 'font-medium' }, 'Recovery: '), entry.recoveryScore, '%'),
                                e('p', null, e('span', { className: 'font-medium' }, 'RHR: '), entry.restingHR, ' bpm'),
                                e('p', null, e('span', { className: 'font-medium' }, 'HRV: '), entry.hrv, ' ms'),
                                e('p', null, e('span', { className: 'font-medium' }, 'Sleep Eff: '), entry.sleepEfficiency, '%'),
                                e('p', null, e('span', { className: 'font-medium' }, 'Deep Sleep: '), entry.deepSleep, ' min'),
                                e('p', null, e('span', { className: 'font-medium' }, 'Strain: '), entry.dayStrain)
                            )
                        )
                    )
                );
            };

            const renderLifestyle = () => {
                if (!data?.lifestyleEntries?.length) {
                    return e('div', { className: 'text-center py-12 text-gray-600' }, 'No lifestyle data');
                }

                return e('div', { className: 'space-y-4' },
                    data.lifestyleEntries.map((entry, idx) =>
                        e('div', { key: idx, className: 'bg-white p-4 rounded-lg border border-gray-200' },
                            e('p', { className: 'font-bold text-gray-900 mb-3' }, entry.date),
                            e('div', { className: 'grid grid-cols-2 gap-3 text-sm' },
                                entry.stressLevel && e('p', null, e('span', { className: 'font-medium' }, 'Stress: '), entry.stressLevel, '/10'),
                                entry.sleepHours && e('p', null, e('span', { className: 'font-medium' }, 'Sleep Hours: '), entry.sleepHours),
                                entry.caffeine && e('p', null, e('span', { className: 'font-medium' }, 'Caffeine: '), entry.caffeine, ' mg'),
                                entry.alcohol && e('p', null, e('span', { className: 'font-medium' }, 'Alcohol: '), entry.alcohol, ' units')
                            ),
                            entry.notes && e('p', { className: 'text-xs text-gray-600 mt-2 italic' }, '📝 ', entry.notes)
                        )
                    )
                );
            };

            const renderInsights = () => {
                if (!data) return e('div', { className: 'text-center py-12' }, 'Calculating insights...');

                const latestBodyComp = data.bodyCompEntries?.[data.bodyCompEntries.length - 1];
                const latestBloodwork = data.bloodworkEntries?.[data.bloodworkEntries.length - 1];
                const latestWhoop = data.whoopEntries?.[data.whoopEntries.length - 1];

                return e('div', { className: 'space-y-4' },
                    e('div', { className: 'bg-blue-50 p-4 rounded-lg border border-blue-200' },
                        e('h3', { className: 'font-bold text-blue-900 mb-2' }, 'Body Composition'),
                        e('p', { className: 'text-sm text-blue-800' },
                            latestBodyComp?.visceralFatArea > 100
                                ? '⚠️ Visceral fat elevated. Focus on fat loss while preserving muscle.'
                                : '✓ Body composition looking good. Continue current approach.'
                        )
                    ),

                    e('div', { className: 'bg-green-50 p-4 rounded-lg border border-green-200' },
                        e('h3', { className: 'font-bold text-green-900 mb-2' }, 'Recovery & Sleep'),
                        e('p', { className: 'text-sm text-green-800' },
                            latestWhoop?.sleepEfficiency >= 90
                                ? '✓ Sleep quality is excellent. This supports hormone production.'
                                : '📊 Sleep efficiency could improve. Aim for 90%+ for optimal recovery.'
                        )
                    ),

                    e('div', { className: 'bg-purple-50 p-4 rounded-lg border border-purple-200' },
                        e('h3', { className: 'font-bold text-purple-900 mb-2' }, 'Hormone Health'),
                        e('p', { className: 'text-sm text-purple-800' },
                            latestBloodwork?.totalTestosterone
                                ? `Your testosterone is at ${latestBloodwork.totalTestosterone} nmol/L. Monitor trends alongside sleep and body composition.`
                                : 'Awaiting bloodwork data to provide hormone insights.'
                        )
                    ),

                    e('div', { className: 'bg-orange-50 p-4 rounded-lg border border-orange-200' },
                        e('h3', { className: 'font-bold text-orange-900 mb-2' }, 'Recommendations'),
                        e('ul', { className: 'text-sm text-orange-800 space-y-1 list-disc list-inside' },
                            e('li', null, 'Track data consistently (weekly bloodwork, bi-weekly EVOLT)'),
                            e('li', null, 'Monitor trends over 4-8 weeks for meaningful patterns'),
                            e('li', null, 'Correlate lifestyle factors with biometric changes'),
                            e('li', null, 'Consider seasonal variations in hormone levels')
                        )
                    )
                );
            };

            if (loading) {
                return e('div', { className: 'flex items-center justify-center h-screen bg-gray-900 text-white' }, 'Loading...');
            }

            return e('div', { className: 'min-h-screen bg-gray-900 text-white' },
                // Header
                e('div', { className: 'bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50' },
                    e('div', { className: 'max-w-4xl mx-auto' },
                        e('h1', { className: 'text-2xl font-bold mb-2' }, 'Health Dashboard'),
                        e('div', { className: 'flex items-center justify-between text-xs text-gray-400' },
                            e('p', null, `Last synced: ${lastSynced || 'Not synced'}`),
                            e('button', {
                                onClick: syncFromGoogleDrive,
                                className: 'px-2 py-1 bg-blue-600 text-white rounded hover:bg-blue-700'
                            }, 'Sync')
                        )
                    )
                ),

                // Navigation
                e('div', { className: 'bg-gray-800 border-b border-gray-700 sticky top-16 z-40' },
                    e('div', { className: 'max-w-4xl mx-auto flex gap-2 overflow-x-auto p-2' },
                        ['dashboard', 'bloodwork', 'fitness', 'lifestyle', 'insights'].map(page =>
                            e('button', {
                                key: page,
                                onClick: () => setCurrentPage(page),
                                className: `px-4 py-2 rounded whitespace-nowrap transition ${
                                    currentPage === page
                                        ? 'bg-blue-600 text-white'
                                        : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                                }`
                            }, page.charAt(0).toUpperCase() + page.slice(1))
                        )
                    )
                ),

                // Content
                e('div', { className: 'max-w-4xl mx-auto p-4 pb-20' },
                    currentPage === 'dashboard' && renderDashboard(),
                    currentPage === 'bloodwork' && renderBloodwork(),
                    currentPage === 'fitness' && renderFitness(),
                    currentPage === 'lifestyle' && renderLifestyle(),
                    currentPage === 'insights' && renderInsights()
                ),

                // Auth notice
                !authenticated && e('div', { className: 'fixed bottom-0 left-0 right-0 bg-yellow-900 text-yellow-100 p-4 text-center text-sm' },
                    'Note: Google Drive integration needs setup. Please see documentation.'
                )
            );
        };

        ReactDOM.render(e(HealthDashboard), document.getElementById('root'));
    </script>
</body>
</html>
